<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Container · Container Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body data-mode="edit">

<nav th:replace="~{fragments/sidebar :: sidebar(active='containers')}"></nav>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-main">

    <div class="app-topbar">
        <div class="d-flex align-items-center">
            <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle navigation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
            <div>
                <h1>Edit Container</h1>
                <div class="page-subtitle">Update dimensions for this truck container record</div>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div id="formAlert" class="alert d-none"></div>

                <div class="content-card" id="formCard">
                    <div id="loadingState" class="text-center text-muted py-4">Loading container...</div>

                    <form id="containerForm" novalidate class="d-none">

                        <div class="row g-3 mb-1">
                            <div class="col-md-6">
                                <label for="truckNumber" class="form-label">Truck Number</label>
                                <input type="text" class="form-control" id="truckNumber" placeholder="e.g. MH12AB1234" required>
                                <div class="invalid-feedback">Truck number cannot be empty.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="vendorCode" class="form-label">Vendor Code</label>
                                <input type="text" class="form-control" id="vendorCode" placeholder="e.g. V001" required>
                                <div class="invalid-feedback">Vendor code cannot be empty.</div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="length" class="form-label">Length (m)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control dim-input" id="length" placeholder="0.00" required>
                                <div class="invalid-feedback">Must be greater than zero.</div>
                            </div>
                            <div class="col-md-4">
                                <label for="width" class="form-label">Width (m)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control dim-input" id="width" placeholder="0.00" required>
                                <div class="invalid-feedback">Must be greater than zero.</div>
                            </div>
                            <div class="col-md-4">
                                <label for="height" class="form-label">Height (m)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control dim-input" id="height" placeholder="0.00" required>
                                <div class="invalid-feedback">Must be greater than zero.</div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <label for="volume" class="form-label">Volume (m³)</label>
                            <div class="volume-field-wrap">
                                <svg class="volume-field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M3 7L12 11L21 7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M12 11V21" stroke="currentColor" stroke-width="1.8"/>
                                </svg>
                                <input type="text" class="form-control calculated-field" id="volume" value="0.00" readonly tabindex="-1">
                            </div>
                            <div class="calculated-hint">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                                    <path d="M12 8V13M12 16H12.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                                Recalculated automatically on save. Reflects the values above.
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent px-4" id="submitBtn">Save Changes</button>
                            <a th:href="@{/containers}" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<script th:src="@{/js/container-form.js}"></script>
</body>
</html>
