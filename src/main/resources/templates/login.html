<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Container Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M3 7L12 11L21 7" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M12 11V21" stroke="white" stroke-width="1.6"/>
            </svg>
        </div>

        <h1>Container Management System</h1>
        <p class="subtitle">Sign in to manage truck container records</p>

        <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                <div class="invalid-feedback">Username is required.</div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                <div class="invalid-feedback">Password is required.</div>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2">Sign in</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Internal tool for internship container data management
        </p>

    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
