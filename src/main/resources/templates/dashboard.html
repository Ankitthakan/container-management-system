<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Container Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}"></nav>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-main">

    <div class="app-topbar">
        <div class="d-flex align-items-center">
            <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle navigation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
            <div>
                <h1>Dashboard</h1>
                <div class="page-subtitle">Overview of truck container records</div>
            </div>
        </div>
        <a th:href="@{/containers/add}" class="btn btn-accent btn-sm">+ Add Container</a>
    </div>

    <div class="app-content">

        <div id="loadError" class="alert alert-danger d-none"></div>

        <!-- Stat cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-blue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M3 7L12 11L21 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M12 11V21" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                    </div>
                    <div class="stat-label">Total Containers</div>
                    <div class="stat-value" id="statTotal">—</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-green">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 19V5M4 19H20M4 19L9 12L13 15L20 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-label">Average Volume</div>
                    <div class="stat-value" id="statAvgVolume">—</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-amber">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M12 7V12L15.5 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="stat-label">Most Recent Entry</div>
                    <div class="stat-value" id="statLatest" style="font-size:1.1rem;">—</div>
                </div>
            </div>
        </div>

        <!-- Latest containers -->
        <div class="content-card">
            <div class="card-title-row">
                <h2>Latest 5 Containers</h2>
                <a th:href="@{/containers}" class="btn btn-sm btn-outline-secondary">View all</a>
            </div>

            <div class="table-responsive">
                <table class="table table-clean mb-0">
                    <thead>
                    <tr>
                        <th>Truck Number</th>
                        <th>Vendor Code</th>
                        <th>Dimensions (L × W × H)</th>
                        <th>Volume</th>
                    </tr>
                    </thead>
                    <tbody id="latestContainersBody">
                    <tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="dashboardEmptyState" class="empty-state d-none">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
                <div>No containers recorded yet.</div>
                <a th:href="@{/containers/add}" class="btn btn-accent btn-sm mt-3">Add your first container</a>
            </div>
        </div>

    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
