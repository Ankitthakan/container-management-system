# =========================================
# Application Info
# =========================================
spring.application.name=container-management

# =========================================
# Server Configuration
# =========================================
server.port=8080

# =========================================
# MySQL Database Configuration
# =========================================
# createDatabaseIfNotExist=true will create the schema on first connection
# if it does not already exist.
spring.datasource.url=jdbc:mysql://localhost:3306/container_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate Configuration
# =========================================
# ddl-auto=update -> Hibernate creates/updates tables automatically
# based on @Entity classes. Safe for dev; do not use in production.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console (helpful while learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL SQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevents Hibernate from opening a session per request unnecessarily
spring.jpa.open-in-view=false

# =========================================
# File Upload (Excel Import)
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# Logging
# =========================================
logging.level.com.example.containermanagement=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================================
# Thymeleaf (frontend not built yet, kept at defaults)
# =========================================
spring.thymeleaf.cache=false
